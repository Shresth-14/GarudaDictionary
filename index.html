<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#c4000b" />
    <meta name="description" content="Hindi and Sanskrit words, searchable in Devanagari or Roman letters." />
    <link rel="icon" href="icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>Garuda Dictionary</title>
  </head>
  <body>
    <header>
      <h1><img src="logo.png" alt="Garuda" width="58" height="38" /> Dictionary <small>prototype</small></h1>
      <input id="q" type="search" inputmode="search" enterkeyhint="search"
        autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false"
        placeholder="dharm, धर्म, dharma" aria-label="Search in Devanagari or Roman letters" />
    </header>
    <main id="results" aria-live="polite"></main>
    <footer>For developers and AI tools: <a href="api/words.json">word list (JSON)</a> · <a href="llms.txt">llms.txt</a></footer>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
